# CAAL Voice Framework - Apple Silicon (M1/M2/M3/M4)
# ==================================================
#
# This compose file is for Apple Silicon Macs. It excludes GPU containers
# (Speaches, Kokoro) since they require NVIDIA CUDA.
#
# Prerequisites:
#   1. Install mlx-audio for STT/TTS:
#      pip install mlx-audio
#
#   2. Start mlx-audio server (runs on port 8000):
#      python -m mlx_audio.server --port 8000
#
#   3. Install Ollama for LLM (native MPS support):
#      brew install ollama
#      ollama pull ministral-3:8b
#
# Usage (recommended - native GPU acceleration):
#   ./start-apple.sh
#   This runs agent natively with MPS GPU for DeepFilterNet noise suppression
#
# Usage (Docker-only mode - no GPU for noise suppression):
#   docker compose -f docker-compose.apple.yaml up -d
#   Access: http://localhost:3000
#
# With HTTPS (Tailscale):
#   docker compose -f docker-compose.apple.yaml --profile https up -d
#
# See .env.example for configuration options.

services:
  # ===========================================================================
  # LiveKit Server - WebRTC Infrastructure
  # ===========================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: caal-livekit
    platform: linux/arm64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # One renderer for every composition (see livekit-render-config.sh):
        # LAN or HTTPS templates, credentials from Docker's environment, and
        # the Redis section only when LIVEKIT_REDIS_ADDRESS is set. A
        # livekit-only recreate therefore cannot silently drop telephony.
        apk add --no-cache gettext > /dev/null 2>&1
        sh /etc/livekit-render-config.sh /etc/livekit.yaml
        exec /livekit-server --config /etc/livekit.yaml --node-ip $${CAAL_HOST_IP}
    ports:
      - "7880:7880"       # WebSocket
      - "7881:7881"       # TCP for WebRTC
      - "7881:7881/udp"   # UDP for WebRTC
      - "5349:5349"       # TURN/TLS (only used in HTTPS mode)
      - "30000-30100:30000-30100/udp"  # TURN relay ports
      # WebRTC media ports. LiveKit advertises these in its own ICE candidates,
      # so the host range, the container range and the range in the rendered
      # config must all be identical.
      - "50100-50200:50100-50200/udp"
    volumes:
      - ./livekit-render-config.sh:/etc/livekit-render-config.sh:ro
      - ./livekit.yaml:/etc/livekit-lan.yaml:ro
      - ./livekit-tailscale.yaml.template:/etc/livekit.yaml.template:ro
      - ./certs:/etc/livekit/certs:ro
    env_file:
      - ./.env
    environment:
      - HTTPS_DOMAIN=${HTTPS_DOMAIN:-}
      - CAAL_HOST_IP=${CAAL_HOST_IP}
      # Empty unless telephony is enabled. The telephony overlay sets it, and
      # an operator running SIP also sets it in .env, so a recreate from this
      # file alone still comes up Redis-backed. See docs/TELEPHONY.md.
      - LIVEKIT_REDIS_ADDRESS=${LIVEKIT_REDIS_ADDRESS:-}
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # CAAL Agent - Voice Processing Pipeline
  # ===========================================================================
  # Connects to mlx-audio running on host for STT/TTS
  agent:
    # Pinned to the image that is already built. The durable work service below
    # runs the same image, so neither service needs a rebuild to pick up code:
    # the runtime source is bind-mounted into both, at both import paths.
    image: caal-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: caal-agent
    platform: linux/arm64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8889:8889"  # Webhook server
    env_file:
      # Also carries the multi-user identity settings (CAAL_INTERNAL_AUTH_SECRET,
      # CAAL_PROFILE_ENCRYPTION_KEYS, CAAL_BOOTSTRAP_ADMIN_EMAIL,
      # CAAL_BOOTSTRAP_ADMIN_PASSWORD_HASH); Cloudflare Access (CF_ACCESS_*) is
      # optional. See docs/STANDALONE-AUTH.md.
      - ./.env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      # Point to mlx-audio (single service for STT + TTS)
      - SPEACHES_URL=${MLX_AUDIO_URL:-http://host.docker.internal:8001}
      - KOKORO_URL=${MLX_AUDIO_URL:-http://host.docker.internal:8001}
      # Point to native DeepFilter server (GPU-accelerated noise suppression)
      - DEEPFILTER_URL=${DEEPFILTER_URL:-http://host.docker.internal:8002}
      # MLX models and voice - override in .env if needed
      - WHISPER_MODEL=${WHISPER_MODEL:-mlx-community/whisper-medium-mlx}
      - TTS_MODEL=${TTS_MODEL:-prince-canuma/Kokoro-82M}
      # mlx-audio Kokoro uses different voices than kokoro-fastapi
      - TTS_VOICE=${TTS_VOICE:-af_heart}
    volumes:
      - caal-memory:/app/data
      - caal-config:/app/config  # Runtime config (mcp_servers.json)
      - ./prompt:/app/prompt
      - ./settings.json:/app/settings.json  # Home Assistant & n8n config
      # Runtime source, read-only, at BOTH import paths the image has: the
      # non-editable install under .venv (which wins on sys.path) and /app/src.
      # Mounting both is what makes agent and worker provably run the same code
      # without rebuilding the image, and without one-off copies into a
      # container that a restart would throw away.
      - ./src/caal:/app/.venv/lib/python3.11/site-packages/caal:ro
      - ./src/caal:/app/src/caal:ro
      - ./voice_agent.py:/app/voice_agent.py:ro
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # CAAL Durable Work Service - background tasks and callbacks
  # ===========================================================================
  # Owns queued work and armed callbacks independently of any LiveKit room or
  # job. It joins no room, publishes no host port, and answers only on the
  # internal network. See docs/DURABLE-WORK.md.
  worker:
    image: caal-agent:latest
    container_name: caal-worker
    platform: linux/arm64
    command: ["python", "-m", "caal.work_service"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - CAAL_WORKER_PORT=${CAAL_WORKER_PORT:-8890}
      # Verification mode: build and authorize each callback request, then put
      # the authorization back untouched instead of dispatching a call. Unset
      # or 0 in normal operation.
      - CAAL_CALLBACK_DISPATCH_DRY_RUN=${CAAL_CALLBACK_DISPATCH_DRY_RUN:-0}
      - CAAL_DURABLE_WORK_POLL_SECONDS=${CAAL_DURABLE_WORK_POLL_SECONDS:-5}
    volumes:
      - caal-memory:/app/data
      - caal-config:/app/config
      - ./prompt:/app/prompt
      - ./settings.json:/app/settings.json
      - ./src/caal:/app/.venv/lib/python3.11/site-packages/caal:ro
      - ./src/caal:/app/src/caal:ro
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/healthz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # Frontend - Next.js Web Interface
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${JARVIS_LIVEKIT_PUBLIC_URL:-wss://jarvis.mexcantech.io}
        - NEXT_PUBLIC_PORCUPINE_ACCESS_KEY=${PORCUPINE_ACCESS_KEY:-}
    container_name: caal-frontend
    platform: linux/arm64
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - NEXT_PUBLIC_LIVEKIT_URL=${JARVIS_LIVEKIT_PUBLIC_URL:-wss://jarvis.mexcantech.io}
      # Server-only CAAL device registry credentials; never exposed with NEXT_PUBLIC_.
      - CAAL_DEVICE_API_URL=http://agent:8889
      - CAAL_DEVICE_ENROLLMENT_TOKEN=${CAAL_DEVICE_ENROLLMENT_TOKEN:-}
      - WEBHOOK_URL=http://agent:8889
      # Deployment guard rails for the published build; see
      # docs/FRONTEND-DEPLOYMENT.md and publish-frontend-build.sh.
      - CAAL_FRONTEND_ALLOW_BAKED_BUILD=${CAAL_FRONTEND_ALLOW_BAKED_BUILD:-}
      - CAAL_FRONTEND_EXPECTED_BUILD_ID=${CAAL_FRONTEND_EXPECTED_BUILD_ID:-}
      # Multi-user identity (server-only; see docs/MULTI-USER-IDENTITY.md). The
      # BFF verifies Cloudflare Access assertions itself and signs short-lived
      # principals for the backend with the shared secret. Leave empty for the
      # legacy single-user mode.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CAAL_INTERNAL_AUTH_SECRET=${CAAL_INTERNAL_AUTH_SECRET:-}
      - CAAL_IDENTITY_API_URL=http://agent:8889
      - CAAL_PUBLIC_ORIGIN=${CAAL_PUBLIC_ORIGIN:-}
      - CAAL_REQUIRE_IDENTITY_FOR_SESSIONS=${CAAL_REQUIRE_IDENTITY_FOR_SESSIONS:-false}
      - CAAL_PASSWORD_LOGIN=${CAAL_PASSWORD_LOGIN:-true}
      - CAAL_ALLOW_INSECURE_COOKIES=${CAAL_ALLOW_INSECURE_COOKIES:-false}
    # The image is only a Node runtime: the application it serves is the build
    # published by ./publish-frontend-build.sh. Mounted read-only at a *side*
    # path -- never over /app/.next, because Docker creates a missing bind
    # source as an empty directory, and an empty directory over the runtime
    # leaves no application at all. See docs/FRONTEND-DEPLOYMENT.md.
    volumes:
      - ./frontend/.next-deploy:/app/.next-deploy:ro
      - ./frontend-build-entrypoint.sh:/app/frontend-build-entrypoint.sh:ro
    # Root only to install the build into /app; the entrypoint drops to the
    # unprivileged image user before it execs the server.
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/frontend-build-entrypoint.sh"]
    # Compose clears the image CMD whenever entrypoint is overridden.
    command: ["node", "server.js"]
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # nginx - HTTPS Reverse Proxy (auto-generates self-signed certs if missing)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: caal-nginx
    platform: linux/arm64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Generate self-signed cert if none exists
        if [ ! -f /etc/nginx/certs/server.crt ]; then
          echo "No certificate found, generating self-signed cert..."
          mkdir -p /etc/nginx/certs
          apk add --no-cache openssl > /dev/null 2>&1
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/server.key \
            -out /etc/nginx/certs/server.crt \
            -subj "/CN=$${CAAL_HOST_IP:-localhost}" 2>/dev/null
          echo "Self-signed certificate generated for $${CAAL_HOST_IP:-localhost}"
        else
          echo "Using existing certificate"
        fi
        exec nginx -g "daemon off;"
    ports:
      - "3443:3443"
      - "7443:7443"
    environment:
      - CAAL_HOST_IP=${CAAL_HOST_IP}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs
    networks:
      - caal-network
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - https

# =============================================================================
# Networks
# =============================================================================
networks:
  caal-network:
    name: caal-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caal-memory:
    name: caal-memory
  caal-config:
    name: caal-config

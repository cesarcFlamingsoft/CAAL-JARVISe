# CAAL Voice Framework - Apple Silicon (M1/M2/M3/M4)
# ==================================================
#
# This compose file is for Apple Silicon Macs. It excludes GPU containers
# (Speaches, Kokoro) since they require NVIDIA CUDA.
#
# Prerequisites:
#   1. Install mlx-audio for STT/TTS:
#      pip install mlx-audio
#
#   2. Start mlx-audio server (runs on port 8000):
#      python -m mlx_audio.server --port 8000
#
#   3. Install Ollama for LLM (native MPS support):
#      brew install ollama
#      ollama pull ministral-3:8b
#
# Usage (recommended - native GPU acceleration):
#   ./start-apple.sh
#   This runs agent natively with MPS GPU for DeepFilterNet noise suppression
#
# Usage (Docker-only mode - no GPU for noise suppression):
#   docker compose -f docker-compose.apple.yaml up -d
#   Access: http://localhost:3000
#
# With HTTPS (Tailscale):
#   docker compose -f docker-compose.apple.yaml --profile https up -d
#
# See .env.example for configuration options.

services:
  # ===========================================================================
  # LiveKit Server - WebRTC Infrastructure
  # ===========================================================================
  livekit:
    image: livekit/livekit-server:latest
    container_name: caal-livekit
    platform: linux/arm64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Render both LAN and HTTPS configuration so settings such as the
        # LiveKit API key can safely come from Docker's secret environment.
        apk add --no-cache gettext > /dev/null 2>&1
        if [ -n "$${HTTPS_DOMAIN}" ]; then
          echo "HTTPS mode: enabling TURN/TLS for $${HTTPS_DOMAIN}"
          envsubst < /etc/livekit.yaml.template > /etc/livekit.yaml
        else
          echo "LAN mode: rendering basic config"
          envsubst < /etc/livekit-lan.yaml > /etc/livekit.yaml
        fi
        exec /livekit-server --config /etc/livekit.yaml --node-ip $${CAAL_HOST_IP}
    ports:
      - "7880:7880"       # WebSocket
      - "7881:7881"       # TCP for WebRTC
      - "7881:7881/udp"   # UDP for WebRTC
      - "5349:5349"       # TURN/TLS (only used in HTTPS mode)
      - "30000-30100:30000-30100/udp"  # TURN relay ports
      - "40000-40100:40000-40100/udp"  # WebRTC media ports; matches advertised ICE candidates
    volumes:
      - ./livekit.yaml:/etc/livekit-lan.yaml:ro
      - ./livekit-tailscale.yaml.template:/etc/livekit.yaml.template:ro
      - ./certs:/etc/livekit/certs:ro
    environment:
      - HTTPS_DOMAIN=${HTTPS_DOMAIN:-}
      - CAAL_HOST_IP=${CAAL_HOST_IP}
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7880"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # CAAL Agent - Voice Processing Pipeline
  # ===========================================================================
  # Connects to mlx-audio running on host for STT/TTS
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    container_name: caal-agent
    platform: linux/arm64
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8889:8889"  # Webhook server
    env_file:
      # Also carries the multi-user identity settings (CAAL_INTERNAL_AUTH_SECRET,
      # CAAL_PROFILE_ENCRYPTION_KEYS, CAAL_BOOTSTRAP_ADMIN_EMAIL,
      # CAAL_BOOTSTRAP_ADMIN_PASSWORD_HASH); Cloudflare Access (CF_ACCESS_*) is
      # optional. See docs/STANDALONE-AUTH.md.
      - ./.env
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      # Point to mlx-audio (single service for STT + TTS)
      - SPEACHES_URL=${MLX_AUDIO_URL:-http://host.docker.internal:8001}
      - KOKORO_URL=${MLX_AUDIO_URL:-http://host.docker.internal:8001}
      # Point to native DeepFilter server (GPU-accelerated noise suppression)
      - DEEPFILTER_URL=${DEEPFILTER_URL:-http://host.docker.internal:8002}
      # MLX models and voice - override in .env if needed
      - WHISPER_MODEL=${WHISPER_MODEL:-mlx-community/whisper-medium-mlx}
      - TTS_MODEL=${TTS_MODEL:-prince-canuma/Kokoro-82M}
      # mlx-audio Kokoro uses different voices than kokoro-fastapi
      - TTS_VOICE=${TTS_VOICE:-af_heart}
    volumes:
      - caal-memory:/app/data
      - caal-config:/app/config  # Runtime config (mcp_servers.json)
      - ./prompt:/app/prompt
      - ./settings.json:/app/settings.json  # Home Assistant & n8n config
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # Frontend - Next.js Web Interface
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
      args:
        - NEXT_PUBLIC_LIVEKIT_URL=${JARVIS_LIVEKIT_PUBLIC_URL:-wss://jarvis.mexcantech.io}
        - NEXT_PUBLIC_PORCUPINE_ACCESS_KEY=${PORCUPINE_ACCESS_KEY:-}
    container_name: caal-frontend
    platform: linux/arm64
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - NEXT_PUBLIC_LIVEKIT_URL=${JARVIS_LIVEKIT_PUBLIC_URL:-wss://jarvis.mexcantech.io}
      # Server-only CAAL device registry credentials; never exposed with NEXT_PUBLIC_.
      - CAAL_DEVICE_API_URL=http://agent:8889
      - CAAL_DEVICE_ENROLLMENT_TOKEN=${CAAL_DEVICE_ENROLLMENT_TOKEN:-}
      - WEBHOOK_URL=http://agent:8889
      # Multi-user identity (server-only; see docs/MULTI-USER-IDENTITY.md). The
      # BFF verifies Cloudflare Access assertions itself and signs short-lived
      # principals for the backend with the shared secret. Leave empty for the
      # legacy single-user mode.
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CAAL_INTERNAL_AUTH_SECRET=${CAAL_INTERNAL_AUTH_SECRET:-}
      - CAAL_IDENTITY_API_URL=http://agent:8889
      - CAAL_PUBLIC_ORIGIN=${CAAL_PUBLIC_ORIGIN:-}
      - CAAL_REQUIRE_IDENTITY_FOR_SESSIONS=${CAAL_REQUIRE_IDENTITY_FOR_SESSIONS:-false}
      - CAAL_PASSWORD_LOGIN=${CAAL_PASSWORD_LOGIN:-true}
      - CAAL_ALLOW_INSECURE_COOKIES=${CAAL_ALLOW_INSECURE_COOKIES:-false}
    networks:
      - caal-network
    depends_on:
      livekit:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # nginx - HTTPS Reverse Proxy (auto-generates self-signed certs if missing)
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: caal-nginx
    platform: linux/arm64
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Generate self-signed cert if none exists
        if [ ! -f /etc/nginx/certs/server.crt ]; then
          echo "No certificate found, generating self-signed cert..."
          mkdir -p /etc/nginx/certs
          apk add --no-cache openssl > /dev/null 2>&1
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /etc/nginx/certs/server.key \
            -out /etc/nginx/certs/server.crt \
            -subj "/CN=$${CAAL_HOST_IP:-localhost}" 2>/dev/null
          echo "Self-signed certificate generated for $${CAAL_HOST_IP:-localhost}"
        else
          echo "Using existing certificate"
        fi
        exec nginx -g "daemon off;"
    ports:
      - "3443:3443"
      - "7443:7443"
    environment:
      - CAAL_HOST_IP=${CAAL_HOST_IP}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs
    networks:
      - caal-network
    depends_on:
      - frontend
    restart: unless-stopped
    profiles:
      - https

# =============================================================================
# Networks
# =============================================================================
networks:
  caal-network:
    name: caal-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  caal-memory:
    name: caal-memory
  caal-config:
    name: caal-config

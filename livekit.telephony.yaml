# CAAL LiveKit configuration when self-hosted SIP is enabled.
# Redis is an internal Docker service; it is not published to the LAN.

port: 7880
log_level: info

keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

redis:
  address: redis:6379

rtc:
  use_external_ip: false
  tcp_port: 7881
  port_range_start: 40000
  port_range_end: 40100

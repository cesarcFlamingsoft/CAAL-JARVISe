port: 7880
log_level: info
# Rendered by docker-compose.apple.yaml with the matching agent credentials.
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}

rtc:
  use_external_ip: false
  tcp_port: 7881
  # LiveKit advertises these ports in its own ICE candidates; Docker does not
  # translate them. Keep them identical to the published range in every
  # compose file and to livekit-tailscale.yaml.template.
  port_range_start: 50100
  port_range_end: 50200

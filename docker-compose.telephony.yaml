# CAAL telephony overlay (draft v3)
# Purpose: add LiveKit SIP + Redis and switch LiveKit to telephony-capable config
# with minimal disruption to the existing CAAL stack.
# This file is intentionally additive and not yet applied.

services:
  livekit:
    volumes:
      - ./livekit.telephony.yaml:/etc/livekit-lan.yaml:ro

  redis:
    image: redis:7-alpine
    container_name: caal-redis
    ports:
      - "6379:6379"
    volumes:
      - caal-redis-data:/data
    restart: unless-stopped

  sip:
    image: livekit/sip:latest
    container_name: caal-sip
    network_mode: host
    depends_on:
      - redis
    environment:
      SIP_CONFIG_BODY: |
        api_key: 'devkey'
        api_secret: 'secret'
        ws_url: 'ws://10.0.0.2:7880'
        redis:
          address: '10.0.0.2:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: false
        logging:
          level: info
    restart: unless-stopped

volumes:
  caal-redis-data:
    name: caal-redis-data

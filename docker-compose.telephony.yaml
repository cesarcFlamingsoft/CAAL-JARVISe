# CAAL telephony overlay for self-hosted LiveKit SIP.
# ==================================================
#
# Apply with (never LiveKit on its own -- use ./telephony-livekit.sh, which
# recreates it under exactly this set):
#   docker compose -f docker-compose.apple.yaml -f docker-compose.telephony.yaml up -d
#
# Router/firewall prerequisite for public PSTN calls:
#   TCP + UDP 5060, UDP 10000-10100 -> this Mac's LAN address.
#
# The overlay adds Redis and SIP; it does not replace the LiveKit configuration.
# LiveKit renders one config from the same templates in every composition and
# appends its Redis section when LIVEKIT_REDIS_ADDRESS is set, so telephony and
# the public HTTPS/TURN deployment coexist instead of excluding each other.
# Set LIVEKIT_REDIS_ADDRESS=redis:6379 in .env as well: that way even a
# livekit-only recreate from the base compose file still comes up Redis-backed.

services:
  livekit:
    # LiveKit refuses SIP without a Redis-backed deployment ("sip not connected
    # (redis required)"). This is the only thing SIP needs from LiveKit here.
    environment:
      LIVEKIT_REDIS_ADDRESS: ${LIVEKIT_REDIS_ADDRESS:-redis:6379}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: caal-redis
    volumes:
      - caal-redis-data:/data
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  sip:
    image: livekit/sip:latest
    container_name: caal-sip
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-devkey}'
        api_secret: '${LIVEKIT_API_SECRET:-secret}'
        ws_url: 'ws://livekit:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
        logging:
          level: info
    networks:
      - caal-network
    restart: unless-stopped

networks:
  caal-network:
    external: true
    name: caal-network

volumes:
  caal-redis-data:
    name: caal-redis-data

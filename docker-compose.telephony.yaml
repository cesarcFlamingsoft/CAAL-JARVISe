# CAAL telephony overlay for self-hosted LiveKit SIP.
# Apply with:
#   docker compose -f docker-compose.apple.yaml -f docker-compose.telephony.yaml up -d
#
# Router/firewall prerequisite for public PSTN calls:
#   TCP + UDP 5060, UDP 10000-10100 -> this Mac's LAN address.

services:
  livekit:
    # SIP requires LiveKit's Redis-backed telephony configuration. The base
    # compose treats any non-empty HTTPS_DOMAIN (even a LAN IP) as TLS mode,
    # whose template has no Redis section; force the SIP-safe branch here.
    environment:
      HTTPS_DOMAIN: ""
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./livekit.telephony.yaml:/etc/livekit-lan.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: caal-redis
    volumes:
      - caal-redis-data:/data
    networks:
      - caal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  sip:
    image: livekit/sip:latest
    container_name: caal-sip
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
      - "10000-10100:10000-10100/udp"
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-devkey}'
        api_secret: '${LIVEKIT_API_SECRET:-secret}'
        ws_url: 'ws://livekit:7880'
        redis:
          address: 'redis:6379'
        sip_port: 5060
        rtp_port: 10000-10100
        use_external_ip: true
        logging:
          level: info
    networks:
      - caal-network
    restart: unless-stopped

networks:
  caal-network:
    external: true
    name: caal-network

volumes:
  caal-redis-data:
    name: caal-redis-data
